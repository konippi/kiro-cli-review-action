name: 'Kiro CLI Review Action'
description: 'Automated PR code review powered by Kiro CLI'
branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  kiro_api_key:
    description: 'Kiro CLI API key'
    required: true
  github_token:
    description: 'GitHub token for PR checkout, PR metadata, and the GitHub MCP server'
    required: false
    default: ${{ github.token }}
  agent:
    description: 'Agent name in .kiro/agents/<name>.json (default: code-reviewer)'
    required: false
  prompt:
    description: 'Direct prompt to execute. When provided, runs in prompt mode without requiring a PR context.'
    required: false
  model:
    description: 'Model ID for Kiro CLI (ignored when agent input is specified)'
    required: false
  timeout_minutes:
    description: 'Kiro execution timeout in minutes (1-360); keep below the job timeout-minutes'
    default: '10'
  trigger_phrase:
    description: 'Trigger phrase for comment-based review (e.g. @kiro or /review)'
    default: '@kiro'
  max_diff_size:
    description: 'Diff size hint in characters for the reviewer (not enforced)'
    default: '10000'
  debug:
    description: 'Log raw stream-json events and Kiro CLI stderr; may expose sensitive tool output'
    default: 'false'
  github_mcp_version:
    description: 'github-mcp-server version to install'
    default: '0.32.0'
  kiro_cli_version:
    description: 'Kiro CLI version to install'
    default: '2.27.1'

outputs:
  conclusion:
    description: 'Run conclusion: success, skipped, timed_out, mcp_startup_failure, agent_not_loaded, run_error, incomplete, or setup_error'

runs:
  using: 'node24'
  main: 'dist/main/index.cjs'
  post: 'dist/post/index.cjs'
