name: Update Major Tag

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name that the major tag will point to (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  update-tag:
    name: Update major version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/publish-action@23f4c6f12633a2da8f44938b71fde9afec138fb4 # v0.4.0
        with:
          source-tag: ${{ github.event.inputs.tag || github.event.release.tag_name }}
