name: E2E Test

on:
  workflow_dispatch:
    inputs:
      test_prompt:
        description: 'Test prompt for kiro-cli'
        required: false
        default: 'List the files in the current directory starting with "package"'

permissions:
  contents: read

jobs:
  test-prompt-mode:
    name: Test Prompt Mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Test with prompt
        id: test
        uses: ./
        with:
          kiro_api_key: ${{ secrets.KIRO_API_KEY }}
          prompt: ${{ inputs.test_prompt }}
          debug: 'true'

      - name: Verify outputs
        if: always()
        env:
          CONCLUSION: ${{ steps.test.outputs.conclusion }}
        run: |
          echo "conclusion: $CONCLUSION"

          if [ "$CONCLUSION" != "success" ]; then
            echo "❌ Expected success conclusion"
            exit 1
          fi
          echo "✅ Action completed successfully"
